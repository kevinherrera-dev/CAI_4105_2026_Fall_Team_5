name: Generate final predictions
on:
  push:
    branches: [kevin-final-predictions]
    paths: ['.github/workflows/generate-predictions.yml', 'Challenge 2/challenge2.ipynb']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'Challenge 2/requirements.txt'
      - name: Install requirements
        run: pip install -r 'Challenge 2/requirements.txt' nbconvert ipykernel
      - name: Execute and verify final notebook
        working-directory: Challenge 2
        run: |
          jupyter nbconvert --to notebook --execute challenge2.ipynb --output /tmp/challenge2-executed.ipynb --ExecutePreprocessor.timeout=1800
          python - <<'PY'
          import pandas as pd
          test = pd.read_csv('Data/challenge2_test.csv')
          pred = pd.read_csv('predictions.csv')
          assert pred.columns.tolist() == ['ID', 'Revenue']
          assert len(pred) == len(test) == 3083
          assert pred['ID'].equals(test['ID'])
          assert pred['Revenue'].isin([True, False]).all()
          print('Verified 3083 predictions in original ID order')
          PY
      - name: Commit generated predictions to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Challenge 2/predictions.csv'
          git diff --cached --quiet || (git commit -m 'Generate verified final predictions CSV' && git push)
